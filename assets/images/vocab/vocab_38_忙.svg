<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#g)"/>
  <rect width="124" height="124" x="2" y="2" rx="24" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <g filter="url(#shadow)">
    
        <!-- Clock face -->
        <circle cx="64" cy="64" r="32" fill="#ffffff" stroke="#c2410c" stroke-width="4"/>
        <circle cx="64" cy="64" r="3" fill="#9a3412"/>
        <line x1="64" y1="64" x2="64" y2="44" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
        <line x1="64" y1="64" x2="80" y2="64" stroke="#ea580c" stroke-width="3" stroke-linecap="round"/>
        <!-- Speed motion lines -->
        <line x1="22" y1="46" x2="32" y2="46" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
        <line x1="18" y1="64" x2="28" y2="64" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
        <line x1="22" y1="82" x2="32" y2="82" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
        
  </g>
</svg>