        <line x1="78" y1="76" x2="90" y2="76" stroke="#fff" stroke-width="1.5"/>
        <!-- Heart on roof -->
        <path d="M64 48 C64 44 60 40 56 40 C52 40 50 44 50 46 C50 52 64 58 64 58 C64 58 78 52 78 46 C78 44 76 40 72 40 C68 40 64 44 64 48 Z" fill="#dc2626"/>
        
