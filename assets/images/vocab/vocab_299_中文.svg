      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#g)"/>
  <rect width="124" height="124" x="2" y="2" rx="24" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <g filter="url(#shadow)">
    
        <!-- Flag canvas -->
        <rect x="22" y="30" width="84" height="56" rx="6" fill="#dc2626" stroke="#b91c1c" stroke-width="2"/>
        <!-- Big Star -->
        <polygon points="38,40 40,46 46,46 41,50 43,56 38,52 33,56 35,50 30,46 36,46" fill="#facc15"/>
        <!-- 4 Small Stars -->
        <polygon points="50,36 51,39 54,39 52,41 53,44 50,42 47,44 48,41 46,39 49,39" fill="#facc15" transform="scale(0.85) translate(10,-2)"/>
        <polygon points="55,42 56,45 59,45 57,47 58,50 55,48 52,50 53,47 51,45 54,45" fill="#facc15" transform="scale(0.85) translate(11,2)"/>
        <polygon points="55,50 56,53 59,53 57,55 58,58 55,56 52,58 53,55 51,53 54,53" fill="#facc15" transform="scale(0.85) translate(11,6)"/>
        <polygon points="50,56 51,59 54,59 52,61 53,64 50,62 47,64 48,61 46,59 49,59" fill="#facc15" transform="scale(0.85) translate(10,9)"/>
        <!-- Base bar -->
        <rect x="34" y="94" width="60" height="8" rx="4" fill="#facc15"/>
        <text x="64" y="100" font-size="7" font-weight="bold" fill="#7f1d1d" text-anchor="middle" dominant-baseline="middle">ZHŌNGGUÓ</text>
        
  </g>
</svg>