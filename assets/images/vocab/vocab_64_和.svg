<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#g)"/>
  <rect width="124" height="124" x="2" y="2" rx="24" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <g filter="url(#shadow)">
    
        <!-- Two puzzle pieces connecting -->
        <rect x="32" y="44" width="32" height="36" rx="4" fill="#38bdf8"/>
        <circle cx="64" cy="62" r="7" fill="#38bdf8"/>
        <rect x="64" y="44" width="32" height="36" rx="4" fill="#f59e0b"/>
        <!-- Sparkle connection -->
        <polygon points="64,30 66,36 72,36 67,40 69,46 64,42 59,46 61,40 56,36 62,36" fill="#ffffff"/>
        
